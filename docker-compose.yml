services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: shiji_atlas
      POSTGRES_USER: shiji
      POSTGRES_PASSWORD: shiji  # local development only
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
